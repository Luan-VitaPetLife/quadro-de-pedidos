<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadro de Pedidos &middot; Vita Pet Life</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">

    <header class="top">
      <h1>Quadro de Pedidos <span class="marca">Vita Pet Life</span></h1>
      <div class="acoes">
        <span class="sync" id="syncLine">Conectando&hellip;</span>
        <button class="btn" id="syncBtn" type="button">Sincronizar</button>
        <button class="btn icone" id="temaBtn" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
          <span id="temaIcone">&#9789;</span>
        </button>
        <button class="btn icone" id="configBtn" type="button" title="Personalizar o quadro" aria-label="Personalizar">&#9881;</button>
      </div>
    </header>

    <!-- Placar: uma faixa, não quatro cartões. O total é contexto; o que
         importa é quantos precisam de ação. -->
    <div class="placar">
      <div class="stat"><span class="n mono" id="cTotal">&ndash;</span><span class="l">no período</span></div>
      <div class="stat ok"><span class="n mono" id="cGreen">&ndash;</span><span class="l">seguindo bem</span></div>
      <div class="stat aviso"><span class="n mono" id="cAmber">&ndash;</span><span class="l">precisam de atenção</span></div>
      <div class="stat erro"><span class="n mono" id="cRed">&ndash;</span><span class="l">com problema</span></div>
    </div>

    <div class="controles">
      <div class="grupo">
        <span class="rotulo">Período</span>
        <div class="segmentado" id="periodos">
          <button class="seg" data-periodo="hoje" data-active="true">Hoje</button>
          <button class="seg" data-periodo="ontem">Ontem</button>
          <button class="seg" data-periodo="semana">Semana</button>
          <button class="seg" data-periodo="mes">Mês</button>
          <button class="seg" data-periodo="tudo">Tudo</button>
        </div>
        <div class="datas">
          <input type="date" id="dataDe" aria-label="Data inicial">
          <span class="ate">até</span>
          <input type="date" id="dataAte" aria-label="Data final">
        </div>
      </div>

      <div class="grupo">
        <span class="rotulo">Situação</span>
        <div class="segmentado" id="filters">
          <button class="seg" data-filter="all" data-active="true">Todos</button>
          <button class="seg" data-filter="red"><i class="pt erro"></i>Problema</button>
          <button class="seg" data-filter="amber"><i class="pt aviso"></i>Atenção</button>
          <button class="seg" data-filter="green"><i class="pt ok"></i>Bem</button>
          <button class="seg" data-filter="bonificacao">Bonificação</button>
        </div>

        <input class="busca" id="search" type="search" placeholder="Buscar pedido, cliente ou rastreio">
      </div>

      <div class="grupo">
        <span class="rotulo">Loja</span>
        <div class="segmentado rolavel" id="brandFilters"></div>
      </div>
    </div>

    <section class="board" id="board">
      <div class="board-topo">
        <span class="board-conta" id="boardConta"></span>
        <button class="btn icone" id="expandirBtn" type="button" title="Expandir para tela cheia" aria-label="Expandir">&#9974;</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="vazio" id="emptyState" hidden></div>
      <div class="legenda">
        <span><i class="pt ok"></i>Seguindo bem</span>
        <span><i class="pt aviso"></i>Precisa de atenção</span>
        <span><i class="pt erro"></i>Com problema</span>
        <span class="tracejado"><i class="pt neutro"></i>Transportadora sem acompanhamento</span>
      </div>
    </section>
  </div>

  <!-- Painel de detalhe do pedido -->
  <div class="cortina" id="backdrop">
    <div class="painel" id="panel" role="dialog" aria-label="Detalhe do pedido"></div>
  </div>

  <!-- Personalização -->
  <div class="cortina" id="configBackdrop">
    <div class="painel config" role="dialog" aria-label="Personalizar o quadro">
      <div class="ph">
        <h2>Personalizar</h2>
        <button class="fechar" id="configFechar" aria-label="Fechar">&times;</button>
      </div>

      <div class="opcao">
        <label for="optTamanho">Tamanho dos cartões</label>
        <div class="segmentado" id="optTamanho">
          <button class="seg" data-tamanho="p">Pequeno</button>
          <button class="seg" data-tamanho="m" data-active="true">Médio</button>
          <button class="seg" data-tamanho="g">Grande</button>
          <button class="seg" data-tamanho="tv">TV</button>
        </div>
      </div>

      <div class="opcao">
        <label for="optForma">Formato</label>
        <div class="segmentado" id="optForma">
          <button class="seg" data-forma="arredondado" data-active="true">Arredondado</button>
          <button class="seg" data-forma="reto">Reto</button>
          <button class="seg" data-forma="quadrado">Quadrado</button>
          <button class="seg" data-forma="pilula">Pílula</button>
          <button class="seg" data-forma="circulo">Círculo</button>
        </div>
      </div>

      <div class="opcao">
        <label>Intensidade da cor</label>
        <div class="segmentado" id="optCor">
          <button class="seg" data-cor="suave">Suave</button>
          <button class="seg" data-cor="media" data-active="true">Média</button>
          <button class="seg" data-cor="forte">Forte</button>
        </div>
      </div>

      <div class="opcao linha">
        <label for="optRastreio">Mostrar código de rastreio</label>
        <input type="checkbox" id="optRastreio" checked>
      </div>

      <div class="opcao linha">
        <label for="optCliente">Mostrar nome do cliente</label>
        <input type="checkbox" id="optCliente">
      </div>

      <p class="dica">As preferências ficam salvas neste navegador. <kbd>Esc</kbd> sai da tela cheia.</p>
      <button class="btn largo" id="configPadrao" type="button">Restaurar padrão</button>
    </div>
  </div>

  <button class="sair-tv" id="sairTv" type="button" hidden>Sair da tela cheia <kbd>Esc</kbd></button>

  <script src="app.js"></script>
</body>
</html>
